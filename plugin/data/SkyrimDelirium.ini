[Data]
; NaturalMotion character file from your own GTA IV install (not shipped with this mod)
sCharacterFile=C:\Program Files (x86)\Steam\steamapps\common\Grand Theft Auto IV\GTAIV\pc\data\naturalmotion\Fred.art
; body and rig fitted to the Skyrim skeleton (fit-test), relative to the game folder
sBody=Data\SKSE\Plugins\SkyrimDelirium\skyrim_build.txt
sRig=Data\SKSE\Plugins\SkyrimDelirium\skyrim_rig.txt

[Test]
; DirectX scan codes: 0x41 = F7 (push the NPC under the crosshair), 0x3C = F2 (hand every body back to Skyrim)
iPushKey=0x41
iReleaseKey=0x3C
; push strength, N s: 80 stumbles, two or three presses in a row knock the body down
fPush=80
; hand back to Skyrim's animation once the body has caught itself; a fallen body is held until Skyrim's get-up
bAutoRelease=1
; the body holds the NPC's live animation pose (guard up, gestures) instead of a fixed stance
bFollowAnimation=1

[Ragdoll]
; Delirium takes over every living NPC Skyrim puts into its ragdoll (Fus Ro Dah, pushes, explosions, other mods) until it gets up
bTakeOver=1
; Skyrim's ragdoll stays the body (its own mass, gravity, collision); Delirium follows it and its muscles turn the bodies.
; Muscle strength on Skyrim's bodies (1 = Delirium's own)
fTorqueGain=1.0
; Skyrim\'s own joint friction while Delirium drives (0 = off so the behaviours show, 1 = untouched); put back when she is let go
fJointFriction=0.0
; while Delirium drives, Skyrim's bodies weigh what Delirium's parts do (1), so its behaviours move her as in the playroom; put back when she is let go
bMatchMass=1
; and grip the ground and bounce as Delirium's parts do (1)
bMatchContact=1

[Arrows]
; an arrow that hits a living NPC: Delirium's shot reaction (stumble, clutch the wound, catch herself or fall)
bShotReaction=1
; the arrow's push at the point it went in, N s (F7 is 80)
fPush=55
; under this share of health (0.2 = 20%) a hit takes her down instead of her catching herself
fWoundedBelow=0.2

[Spells]
; destruction spells' projectiles (firebolt, ice spike, lightning bolt, chain lightning, ...) hit like arrows (same push):
; frost as an arrow, fire burns on top (the arms beat at the flames), shock jolts. Streams (Flames, Sparks) are left out
bShotReaction=1
; seconds she burns / is shocked after a hit
fBurnTime=2.5
fShockTime=2.0
; channelled spells (Flames, Frostbite, Sparks): no shot, only the fire / shock / ice, for this long after the last hit (s)
fChannelLinger=0.6

[Stagger]
; every stagger Skyrim gives an NPC (a heavy blow, a shield bash, Fus, magic stagger, area staggers) is played by
; Delirium as a push: away from the attacker, harder for a stronger stagger. Skyrim's stagger still stops what she does
bReplace=1
; push for the strongest stagger (magnitude 1), N s; a light one gets fMinShare of it (F7 is 80)
fPush=90
fMinShare=0.4
; a melee blow that staggers pushes as hard as the blow ([Melee]) x (1 + fHitBoost x the stagger's magnitude)
fHitBoost=0.5

[Melee]
; while Delirium has her (a stagger, an arrow, a spell), every blow reacts: a light one flinches (guard up, turned to
; the attacker), a heavier one makes her step to catch it; past what she can catch she falls
bReact=1
; push for a plain blow (iron sword, 15 damage), N s; x for a power attack, a shield bash, a sneak
; attack, a blocked blow
fPush=50
fPower=2.2
fBash=1.6
fSneak=1.3
fBlocked=0.5
; heavier weapons push harder: by the square root of weight/fWeightRef, within fHeftMin-fHeftMax (dagger 0.6, iron
; sword 1, greatsword ~1.4, warhammer ~1.7)
fWeightRef=9
fHeftMin=0.6
fHeftMax=1.7
; a swing's sideways sweep bends the push (0 = straight away from the attacker); an overhead chop pushes down this much
fSwing=0.5
fChop=0.35
; blows pushing less than this flinch, harder ones step, N s
fFlinchBelow=55

; a heavy blow (power attack, heavy weapon, big damage): oomph 0 at fOomphFrom x a plain blow's push, 1 at fOomphTo.
; It leans her back, snaps the head (fHeadWhip of the push at the head), reels her ([Hits] fReelAt), and from
; fKnockAt it takes her down (over 1: never)
fOomphFrom=1.3
fOomphTo=4.0
fKnockAt=1.01
fHeadWhip=0.2
; a blow pushes at most this, N s (past it the stagger, flailing and fall carry it: one big shove looks limp)
fMaxPush=160

[Explosions]
; an explosion (Fireball, runes, explosive arrows) pushes everyone it catches away from its centre, with the element's
; reaction on top: fPush N s at the centre for a [Hits] fDamageRef-damage explosion, fFarShare of it at the edge, its
; upward part fUp (0 flat). Strong ones reel like strong spells ([Hits])
bPush=1
fPush=90
fFarShare=0.4
fUp=0.25
; it throws her: fFlySpeed m/s at the centre for fDamageRef damage (x the damage scale, x fFarShare-1 by nearness),
; fFlyUp m/s up per m/s along, capped at fFlyMax; under fFlyMin she only takes the push. In the air her arms windmill
; and legs pedal (or she rolls up), and she reaches to catch the fall coming down
fFlySpeed=3.0
fFlyUp=0.65
fFlyMin=2.0
fFlyMax=9.0
; from fHighFallAt m/s she is thrown far (Delirium's highFall, its own arms and legs and catch); a push of fTumble N s
; per m/s at the head tumbles her
fHighFallAt=4.5
fTumble=10

[Down]
; knocked down (thrown, or a heavy blow): she writhes on the ground fWritheTime + fWritheAdd x oomph s (half for a
; blow), or curls up (fFoetalChance), before she lies still and Skyrim gets her up
fWritheTime=1.0
fWritheAdd=1.2
fFoetalChance=0.3

[Hits]
; arrows, spells, melee and staggers push harder for a harder hit, the same for everyone: fDamageRef damage pushes at
; 1x, twice the damage 2^fExponent as hard (1.74x at 0.8), within fScaleMin-fScaleMax
fDamageRef=15
fExponent=0.8
fScaleMin=0.4
fScaleMax=3.0
; a hit past a plain one jolts harder on top (arrows, spells): oomph goes 0-1 as the damage scale above goes
; fOomphFrom-fOomphTo; the shot twists her x(1 + fOomphSpin x oomph), leans her back 0.3 + fOomphLean x oomph and
; pushes x(1 + fOomphPush x oomph)
fOomphFrom=1.0
fOomphTo=2.5
fOomphSpin=2.0
fOomphLean=0.9
fOomphPush=1.0
; from fReelAt oomph she reels back on loose legs (Delirium's staggerFall) for fReelTime + fReelTimeAdd x oomph s,
; then catches herself; from fFallAt the reel takes her down (over 1: never forced, she falls only if she can't
; catch it)
fReelAt=0.3
fFallAt=1.01
fReelTime=0.8
fReelTimeAdd=1.6
; a spell's or arrow's push at most, N s (past it one shove knocks her over limp; the shot, reel and flailing carry it)
fMaxPush=150

[Collision]
; the body collides with Skyrim's own world collision (floors, stairs, walls, terrain, rocks, trees) instead of a flat floor
bWorldCollision=1
; how far around the NPC to take it, game units (70 = 1 m), sideways and up/down
fRadius=600
fHeight=300
iMaxTriangles=40000

[Deaths]
; Skyrim's killmoves off (the KillMove global; a save keeps it: `set killmove to 1` brings them back) (1)
bNoKillMoves=1
; kill cams off (fKillCamBaseOdds 0, bVATSDisable) (1)
bNoKillCams=1
; seconds a killed NPC may die on her feet in Delirium (wounded, staggering, collapsing; kept at 1 health) before the
; death goes through; sooner once she is down (3, 0 = die at once)
fDyingTime=3
; dying on her feet: seconds she fights to stay up before she collapses (0.8 / 1.6)
fCollapseAfterMin=0.8
fCollapseAfterMax=1.6
; the killing blow as Delirium's shot at this health (0 = fatal: every muscle off in 0.5 s, a flop; under 100 = wounded, falls) (70)
fDyingHealth=70
; seconds until the corpse goes limp (1.8 / 3.0)
fLimpAfterMin=1.8
fLimpAfterMax=3.0
; chance of a weak writhe on the ground first (0.5), of the arms going out to break the fall (0.5)
fWritheChance=0.5
fCatchFallChance=0.5
; m/s away from the killer as she dies, in place of Skyrim's own death motion (it lunges toward him) (1.5)
fDeathPush=1.5
; m/s cap on any body as she dies (Skyrim's death throws limbs at 17 m/s) (6)
fDeathMaxSpeed=6
; seconds the dying shot (reaching for the wound, breaking the fall) plays before a writhe (1.2)
fShotTime=1.2
